# gpiote130 has no interrupt line on FLPR, and this app only drives outputs,
# so build the GPIO driver without GPIOTE-based interrupt support.
CONFIG_GPIO_NRFX_INTERRUPT=n

# The console is on uart135, whose IRQ cannot be routed to FLPR; keep the
# UART driver in polling mode.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=n
