# Configuration overlay for the sysbuild-generated uicr image.
#
# Explicitly ensure UICR.PERIPHCONF is populated (pointing at the
# periphconf_partition) and that the PERIPHCONF hex is generated from the
# devicetree of every image in the sysbuild, rather than relying silently on
# Kconfig defaults.
CONFIG_GEN_UICR_PERIPHCONF=y
CONFIG_GEN_UICR_GENERATE_PERIPHCONF=y
