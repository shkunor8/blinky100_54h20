CONFIG_GPIO=y

# y: blink loop writes GPIO OUTSET/OUTCLR registers directly.
# n: blink loop uses gpio_pin_toggle_dt().
CONFIG_BLINKY_BARE_METAL_GPIO=y

# Explicitly ensure this image's peripheral usage (UART console, GPIO/LED,
# scope-probe pin) is emitted as UICR.PERIPHCONF entries rather than relying
# silently on the Kconfig default.
CONFIG_NRF_PERIPHCONF_GENERATE_ENTRIES=y
